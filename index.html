<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <body class="login-body">

    <main class="login-container">

        <section class="login-info">

            <h1>NEXUS</h1>

            <h2>Tu lugar favorito para ver transmisiones, hablar y compartir.</h2>

            <p>
                Descubre transmisiones, comunidades
                y personas con tus mismos gustos e intereses.
            </p>

        </section>


        <section class="login-formulario">

            <h2>Iniciar sesión</h2>

            <form id="loginForm">

                <label for="email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.cl"
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                >


                <button type="submit">
                    Entrar
                </button>

            </form>

        </section>

    </main>

</body>
</html>
